<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coming soon</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f1115;
      color: #e8e6e1;
    }
    main { max-width: 32rem; text-align: center; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #f0b429; margin: 0 auto 1.5rem;
      animation: pulse 2s ease-in-out infinite;
    }
    h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 600; letter-spacing: -0.02em; }
    p { margin-top: 1rem; color: #a3a09a; line-height: 1.6; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true"></div>
    <h1>Coming soon</h1>
    <p>This site is being set up. Check back shortly.</p>
  </main>
</body>
</html>
